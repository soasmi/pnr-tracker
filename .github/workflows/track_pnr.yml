name: 24/7 Indian Railways PNR Tracker

on:
  schedule:
    # Runs automatically every 30 minutes, 24/7 in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

permissions:
  contents: write

jobs:
  check-pnr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Check PNRs & Alert Phones
        run: |
          python pnr_tracker.py --once

      - name: Commit State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pnr_state.json
          git diff --staged --quiet || (git commit -m "Auto-update PNR status state [skip ci]" && git push)
